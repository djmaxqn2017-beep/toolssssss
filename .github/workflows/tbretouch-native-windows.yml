name: Build TBRetoch Native Windows

on:
  workflow_dispatch:
  push:
    branches:
      - tbretouch-v0.5-native-core
    paths:
      - 'tuan-bo-ai-studio/native/**'
      - '.github/workflows/tbretouch-native-windows.yml'

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          arch: 'win64_msvc2022_64'
          modules: 'qtshadertools qtimageformats'
          cache: true

      - name: Configure
        shell: pwsh
        run: cmake -S tuan-bo-ai-studio/native -B tuan-bo-ai-studio/native/build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON

      - name: Build
        shell: pwsh
        run: cmake --build tuan-bo-ai-studio/native/build --config Release --parallel

      - name: Test native image pipeline
        shell: pwsh
        run: ctest --test-dir tuan-bo-ai-studio/native/build -C Release --output-on-failure

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $pkg = 'tuan-bo-ai-studio/native/package'
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item 'tuan-bo-ai-studio/native/build/Release/TBRetoch.exe' "$pkg/TBRetoch.exe"
          windeployqt --release --qmldir 'tuan-bo-ai-studio/native/qml' --no-translations "$pkg/TBRetoch.exe"
          foreach ($dll in @('vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll')) {
            if (-not (Test-Path "$pkg/$dll")) { Copy-Item "$env:SystemRoot/system32/$dll" "$pkg/$dll" }
          }
          @(
            'TBRetoch V0.5 Native Core',
            'This is an engineering build of the new native core.',
            'GPU viewer: Qt RHI / Direct3D on Windows.',
            'Export: original-resolution source, CPU pipeline.',
            'No license/quota system.'
          ) | Set-Content "$pkg/README.txt" -Encoding UTF8

      - name: Verify deployed application starts
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QSG_RHI_BACKEND = 'd3d11'
          $proc = Start-Process -FilePath './tuan-bo-ai-studio/native/package/TBRetoch.exe' -ArgumentList '--smoke-test' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Application smoke test failed: $($proc.ExitCode)" }

      - name: Package portable build
        shell: pwsh
        run: |
          Compress-Archive -Path 'tuan-bo-ai-studio/native/package/*' -DestinationPath 'TBRetoch-V0.5-Native-Core-Windows.zip' -Force

      - name: Build offline installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" 'tuan-bo-ai-studio/native/installer.iss'
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }

      - name: Verify installed application and rendered preview
        shell: pwsh
        run: |
          $installDir = Join-Path $PWD 'smoke-installed'
          $setup = './tuan-bo-ai-studio/native/dist/TBRetoch-Native-Core-Setup.exe'
          $proc = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/LANG=vietnamese', ('/DIR="' + $installDir + '"')) -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Silent installation failed: $($proc.ExitCode)" }
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          $env:QT_QPA_PLATFORM = 'windows'
          $env:QSG_RHI_PREFER_SOFTWARE_RENDERER = '1'
          $env:QSG_RHI_BACKEND = 'd3d11'
          $env:TBRETOCH_SMOKE_SCREENSHOT = Join-Path $PWD 'native-preview.png'
          $proc = Start-Process -FilePath "$installDir/TBRetoch.exe" -ArgumentList '--render-smoke-test' -Wait -PassThru -RedirectStandardError 'native-render.log'
          Get-Content 'native-render.log'
          if ($proc.ExitCode -ne 0) { throw "Installed render test failed: $($proc.ExitCode)" }

      - name: Upload installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TBRetoch-Native-Core-Installer-Windows
          if-no-files-found: error
          path: tuan-bo-ai-studio/native/dist/TBRetoch-Native-Core-Setup.exe

      - name: Upload portable build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TBRetoch-Native-Core-Portable-Windows
          if-no-files-found: error
          path: TBRetoch-V0.5-Native-Core-Windows.zip

      - name: Upload preview diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TBRetoch-Native-Core-Validation
          path: |
            native-preview.png
            native-render.log
