name: Build TBRetoch Native Windows

on:
  workflow_dispatch:
  push:
    branches:
      - tbretouch-v0.5-native-core
    paths:
      - 'tuan-bo-ai-studio/native/**'
      - '.github/workflows/tbretouch-native-windows.yml'

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          arch: 'win64_msvc2022_64'
          modules: 'qtshadertools qtimageformats'
          cache: true

      - name: Install RAW and HEIC decoders
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install libraw:x64-windows 'libheif[core]:x64-windows'
          if ($LASTEXITCODE -ne 0) { throw "Image decoder installation failed" }
          $env:PATH = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin;$env:PATH"
          "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure
        shell: pwsh
        run: cmake -S tuan-bo-ai-studio/native -B tuan-bo-ai-studio/native/build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        shell: pwsh
        run: cmake --build tuan-bo-ai-studio/native/build --config Release --parallel

      - name: Obtain upstream HEIC regression fixture
        shell: pwsh
        run: |
          $fixture = Join-Path $PWD 'upstream-example.heic'
          Invoke-WebRequest 'https://raw.githubusercontent.com/strukturag/libheif/v1.20.2/examples/example.heic' -OutFile $fixture
          "TBRETOCH_HEIC_FIXTURE=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test native image pipeline
        shell: pwsh
        run: ctest --test-dir tuan-bo-ai-studio/native/build -C Release --output-on-failure

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $pkg = 'tuan-bo-ai-studio/native/package'
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item 'tuan-bo-ai-studio/native/build/Release/TBRetoch.exe' "$pkg/TBRetoch.exe"
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll" "$pkg/"
          if (Test-Path "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/plugins/libheif") {
            Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/plugins/libheif/*.dll" "$pkg/"
          }
          New-Item -ItemType Directory -Force -Path "$pkg/third-party" | Out-Null
          foreach ($name in @('libraw', 'libheif', 'libde265')) {
            Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/share/$name/copyright" "$pkg/third-party/$name-LICENSE.txt"
          }
          windeployqt --release --qmldir 'tuan-bo-ai-studio/native/qml' --no-translations "$pkg/TBRetoch.exe"
          foreach ($dll in @('vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll')) {
            if (-not (Test-Path "$pkg/$dll")) { Copy-Item "$env:SystemRoot/system32/$dll" "$pkg/$dll" }
          }
          @(
            'TBRetoch 0.6.2',
            'Import, color/HSL, tone curves, crop/rotate, detail, presets, selective sync and batch export.',
            'GPU viewer: Qt RHI / Direct3D on Windows.',
            'Export: original-resolution source, CPU pipeline.',
            'No license/quota system. Portrait AI is not implemented in this build.'
          ) | Set-Content "$pkg/README.txt" -Encoding UTF8

      - name: Verify deployed application starts
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QSG_RHI_BACKEND = 'd3d11'
          $proc = Start-Process -FilePath './tuan-bo-ai-studio/native/package/TBRetoch.exe' -ArgumentList '--smoke-test' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Application smoke test failed: $($proc.ExitCode)" }

      - name: Package portable build
        shell: pwsh
        run: |
          Compress-Archive -Path 'tuan-bo-ai-studio/native/package/*' -DestinationPath 'TBRetoch-0.6.2-Windows.zip' -Force

      - name: Build offline installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" 'tuan-bo-ai-studio/native/installer.iss'
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }

      - name: Verify installed application and rendered preview
        shell: pwsh
        run: |
          $installDir = Join-Path $PWD 'smoke-installed'
          $setup = './tuan-bo-ai-studio/native/dist/TBRetoch-Native-Core-Setup.exe'
          $proc = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/LANG=vietnamese', ('/DIR="' + $installDir + '"')) -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Silent installation failed: $($proc.ExitCode)" }
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          $env:QT_QPA_PLATFORM = 'windows'
          $env:QSG_RHI_PREFER_SOFTWARE_RENDERER = '1'
          $env:QSG_RHI_BACKEND = 'd3d11'
          $import = Start-Process -FilePath "$installDir/TBRetoch.exe" -ArgumentList '--import-smoke-test' -Wait -PassThru -RedirectStandardError 'native-import.log'
          Get-Content 'native-import.log'
          if ($import.ExitCode -ne 0) { throw "Installed import test failed: $($import.ExitCode)" }
          $env:TBRETOCH_SMOKE_SCREENSHOT = Join-Path $PWD 'native-preview.png'
          $proc = Start-Process -FilePath "$installDir/TBRetoch.exe" -ArgumentList '--render-smoke-test' -Wait -PassThru -RedirectStandardError 'native-render.log'
          Get-Content 'native-render.log'
          if ($proc.ExitCode -ne 0) { throw "Installed render test failed: $($proc.ExitCode)" }
          $env:TBRETOCH_SMOKE_SCREENSHOT = Join-Path $PWD 'advanced-preview.png'
          $proc = Start-Process -FilePath "$installDir/TBRetoch.exe" -ArgumentList '--advanced-render-smoke-test' -Wait -PassThru -RedirectStandardError 'native-advanced.log'
          Get-Content 'native-advanced.log'
          if ($proc.ExitCode -ne 0) { throw "Installed advanced render test failed: $($proc.ExitCode)" }

      - name: Upload installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TBRetoch-Native-Core-Installer-Windows
          if-no-files-found: error
          path: tuan-bo-ai-studio/native/dist/TBRetoch-Native-Core-Setup.exe

      - name: Upload portable build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TBRetoch-Native-Core-Portable-Windows
          if-no-files-found: error
          path: TBRetoch-0.6.2-Windows.zip

      - name: Upload preview diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TBRetoch-Native-Core-Validation
          path: |
            native-preview.png
            native-render.log
            native-import.log
            advanced-preview.png
            native-advanced.log
