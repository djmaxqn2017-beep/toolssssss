name: Build TBRetoch Native Windows

on:
  workflow_dispatch:
  push:
    branches:
      - tbretouch-v0.5-native-core
    paths:
      - 'tuan-bo-ai-studio/native/**'
      - '.github/workflows/tbretouch-native-windows.yml'

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          arch: 'win64_msvc2022_64'
          modules: 'qtshadertools qtimageformats'
          cache: true

      - name: Cache native decoder builds
        uses: actions/cache/restore@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: tbretouch-decoders-windows-2022-v1

      - name: Install RAW and HEIC decoders
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install libraw:x64-windows 'libheif[core]:x64-windows'
          if ($LASTEXITCODE -ne 0) { throw "Image decoder installation failed" }
          $env:PATH = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin;$env:PATH"
          "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Save native decoder cache
        uses: actions/cache/save@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: tbretouch-decoders-windows-2022-v1

      - name: Set up build-only Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare native AI and metadata runtime
        shell: pwsh
        run: |
          python -m pip install 'numpy==1.26.4' 'tensorflow-cpu==2.17.1' 'tf2onnx==1.16.1' 'onnx==1.17.0' 'onnxruntime==1.23.2'
          if ($LASTEXITCODE -ne 0) { throw "Build-only model converter installation failed" }
          python tuan-bo-ai-studio/native/scripts/prepare_runtime.py native-deps
          if ($LASTEXITCODE -ne 0) { throw "Native AI runtime preparation failed" }
          $deps = Join-Path $PWD 'native-deps'
          "$deps/opencv/build/x64/vc16/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "$deps/ort/runtimes/win-x64/native" | Out-File -FilePath $env:GITHUB_PATH -Append
          "$deps/directml/bin/x64-win" | Out-File -FilePath $env:GITHUB_PATH -Append
          "TBRETOCH_MODEL_DIR=$deps/models" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TBRETOCH_EXIFTOOL_PATH=$deps/exiftool/exiftool-13.59_64/exiftool.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          Rename-Item "$deps/exiftool/exiftool-13.59_64/exiftool(-k).exe" 'exiftool.exe'
          Invoke-WebRequest 'https://raw.githubusercontent.com/yakhyo/mediapipe-face-mesh-onnx/main/assets/inputs/man_smiling.jpg' -OutFile "$deps/portrait.jpg"
          "TBRETOCH_PORTRAIT_FIXTURE=$deps/portrait.jpg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        shell: pwsh
        run: cmake -S tuan-bo-ai-studio/native -B tuan-bo-ai-studio/native/build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" "-DOpenCV_DIR=$PWD/native-deps/opencv/build" "-DONNXRUNTIME_INCLUDE_DIR=$PWD/native-deps/ort/build/native/include" "-DONNXRUNTIME_LIBRARY=$PWD/native-deps/ort/runtimes/win-x64/native/onnxruntime.lib"

      - name: Build
        shell: pwsh
        run: |
          cmake --build tuan-bo-ai-studio/native/build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "Native build failed" }
          # Use the same local runtime layout for tests and the installed app.
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll" 'tuan-bo-ai-studio/native/build/Release/'
          windeployqt --release --no-translations 'tuan-bo-ai-studio/native/build/Release/TBRetochTests.exe'
          if ($LASTEXITCODE -ne 0) { throw "Test runtime deployment failed" }
          # Windows searches System32 before PATH. Keep the pinned inference
          # runtime beside both binaries, including during CTest.
          Copy-Item 'native-deps/ort/runtimes/win-x64/native/*.dll' 'tuan-bo-ai-studio/native/build/Release/'
          Copy-Item 'native-deps/directml/bin/x64-win/DirectML.dll' 'tuan-bo-ai-studio/native/build/Release/'
          Copy-Item 'native-deps/opencv/build/x64/vc16/bin/opencv_world4110.dll' 'tuan-bo-ai-studio/native/build/Release/'
          New-Item -ItemType Directory -Force -Path 'tuan-bo-ai-studio/native/build/Release/heif/plugins' | Out-Null
          if (Test-Path "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/plugins/libheif") {
            Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/plugins/libheif/*.dll" 'tuan-bo-ai-studio/native/build/Release/heif/plugins/'
          }

      - name: Obtain upstream HEIC regression fixture
        shell: pwsh
        run: |
          $fixture = Join-Path $PWD 'upstream-example.heic'
          Invoke-WebRequest 'https://raw.githubusercontent.com/strukturag/libheif/v1.20.2/examples/example.heic' -OutFile $fixture
          "TBRETOCH_HEIC_FIXTURE=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test native image pipeline
        shell: pwsh
        run: |
          # Prevent a loader error dialog from hanging an unattended launch.
          Add-Type @'
          using System.Runtime.InteropServices;
          public static class NativeErrorMode {
            [DllImport("kernel32.dll")] public static extern uint SetErrorMode(uint mode);
          }
          '@
          [NativeErrorMode]::SetErrorMode(0x8003) | Out-Null
          ctest --test-dir tuan-bo-ai-studio/native/build -C Release -V --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Native controller tests failed" }

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $pkg = 'tuan-bo-ai-studio/native/package'
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item 'tuan-bo-ai-studio/native/build/Release/TBRetoch.exe' "$pkg/TBRetoch.exe"
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll" "$pkg/"
          if (Test-Path "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/plugins/libheif") {
            New-Item -ItemType Directory -Force -Path "$pkg/heif/plugins" | Out-Null
            Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/plugins/libheif/*.dll" "$pkg/heif/plugins/"
          }
          New-Item -ItemType Directory -Force -Path "$pkg/third-party" | Out-Null
          foreach ($name in @('libraw', 'libheif', 'libde265')) {
            Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/share/$name/copyright" "$pkg/third-party/$name-LICENSE.txt"
          }
          Copy-Item 'native-deps/models' "$pkg/models" -Recurse
          Copy-Item 'native-deps/opencv/build/x64/vc16/bin/opencv_world4110.dll' "$pkg/"
          Copy-Item 'native-deps/ort/runtimes/win-x64/native/*.dll' "$pkg/"
          Copy-Item 'native-deps/directml/bin/x64-win/DirectML.dll' "$pkg/"
          Copy-Item 'native-deps/exiftool/exiftool-13.59_64/*' "$pkg/" -Recurse
          Copy-Item 'tuan-bo-ai-studio/native/third-party/*' "$pkg/third-party/"
          Copy-Item 'native-deps/ort/LICENSE' "$pkg/third-party/ONNXRuntime-LICENSE.txt"
          Copy-Item 'native-deps/directml/LICENSE*' "$pkg/third-party/"
          Copy-Item 'native-deps/opencv/LICENSE*' "$pkg/third-party/"
          windeployqt --release --qmldir 'tuan-bo-ai-studio/native/qml' --no-translations "$pkg/TBRetoch.exe"
          foreach ($dll in @('vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll')) {
            if (-not (Test-Path "$pkg/$dll")) { Copy-Item "$env:SystemRoot/system32/$dll" "$pkg/$dll" }
          }
          @(
            'TBRetoch 0.7.0',
            'Import, color/HSL, tone curves, crop/rotate, detail, presets, selective sync and batch export.',
            'GPU viewer: Qt RHI / Direct3D on Windows.',
            'Export: original-resolution source, CPU pipeline.',
            'Offline semantic masks, 478 face landmarks, portrait, clothing repair, depth blur and sky replacement.',
            'Default Master export: untouched source is byte-identical; edited output is lossless PNG16 with metadata.',
            'JPEG export is lossy and its size changes with photo content. No license/quota system.'
          ) | Set-Content "$pkg/README.txt" -Encoding UTF8

      - name: Verify deployed application starts
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QSG_RHI_BACKEND = 'd3d11'
          $proc = Start-Process -FilePath './tuan-bo-ai-studio/native/package/TBRetoch.exe' -ArgumentList '--smoke-test' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Application smoke test failed: $($proc.ExitCode)" }

      - name: Package portable build
        shell: pwsh
        run: |
          Compress-Archive -Path 'tuan-bo-ai-studio/native/package/*' -DestinationPath 'TBRetoch-0.7.0-Windows.zip' -Force

      - name: Build offline installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" 'tuan-bo-ai-studio/native/installer.iss'
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }

      - name: Verify installed application and rendered preview
        shell: pwsh
        run: |
          $installDir = Join-Path $PWD 'smoke-installed'
          $setup = './tuan-bo-ai-studio/native/dist/TBRetoch-Native-Core-Setup.exe'
          $proc = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/LANG=vietnamese', ('/DIR="' + $installDir + '"')) -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Silent installation failed: $($proc.ExitCode)" }
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          Remove-Item Env:TBRETOCH_MODEL_DIR
          Remove-Item Env:TBRETOCH_EXIFTOOL_PATH
          $env:QT_QPA_PLATFORM = 'windows'
          $env:QSG_RHI_PREFER_SOFTWARE_RENDERER = '1'
          $env:QSG_RHI_BACKEND = 'd3d11'
          $import = Start-Process -FilePath "$installDir/TBRetoch.exe" -ArgumentList '--import-smoke-test' -Wait -PassThru -RedirectStandardError 'native-import.log'
          Get-Content 'native-import.log'
          if ($import.ExitCode -ne 0) { throw "Installed import test failed: $($import.ExitCode)" }
          $env:TBRETOCH_SMOKE_SCREENSHOT = Join-Path $PWD 'native-preview.png'
          $proc = Start-Process -FilePath "$installDir/TBRetoch.exe" -ArgumentList '--render-smoke-test' -Wait -PassThru -RedirectStandardError 'native-render.log'
          Get-Content 'native-render.log'
          if ($proc.ExitCode -ne 0) { throw "Installed render test failed: $($proc.ExitCode)" }
          $env:TBRETOCH_SMOKE_SCREENSHOT = Join-Path $PWD 'advanced-preview.png'
          $proc = Start-Process -FilePath "$installDir/TBRetoch.exe" -ArgumentList '--advanced-render-smoke-test' -Wait -PassThru -RedirectStandardError 'native-advanced.log'
          Get-Content 'native-advanced.log'
          if ($proc.ExitCode -ne 0) { throw "Installed advanced render test failed: $($proc.ExitCode)" }

          $env:TBRETOCH_SMOKE_SCREENSHOT = Join-Path $PWD 'ai-preview.png'
          $proc = Start-Process -FilePath "$installDir/TBRetoch.exe" -ArgumentList '--ai-ui-smoke-test' -Wait -PassThru -RedirectStandardError 'native-ai.log'
          Get-Content 'native-ai.log'
          if ($proc.ExitCode -ne 0) { throw "Installed interactive AI test failed: $($proc.ExitCode)" }

      - name: Upload installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TBRetoch-Native-Core-Installer-Windows
          if-no-files-found: error
          path: tuan-bo-ai-studio/native/dist/TBRetoch-Native-Core-Setup.exe

      - name: Upload portable build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TBRetoch-Native-Core-Portable-Windows
          if-no-files-found: error
          path: TBRetoch-0.7.0-Windows.zip

      - name: Upload preview diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TBRetoch-Native-Core-Validation
          path: |
            native-preview.png
            native-render.log
            native-import.log
            advanced-preview.png
            native-advanced.log
            ai-preview.png
            native-ai.log
