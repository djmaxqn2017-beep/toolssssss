name: Build TBRetoch Windows

on:
  workflow_dispatch:
  push:
    branches:
      - tbretouch-v0.4
    paths:
      - 'tuan-bo-ai-studio/studio/**'
      - '.github/workflows/tuan-bo-ai-studio-windows.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download offline BiRefNet Lite model
        shell: pwsh
        run: |
          $root = 'tuan-bo-ai-studio/studio/resources/models/onnx-community/BiRefNet_lite-ONNX'
          New-Item -ItemType Directory -Force -Path "$root/onnx" | Out-Null
          curl.exe -L --retry 4 --retry-delay 3 -o "$root/config.json" "https://huggingface.co/onnx-community/BiRefNet_lite-ONNX/resolve/main/config.json?download=true"
          curl.exe -L --retry 4 --retry-delay 3 -o "$root/preprocessor_config.json" "https://huggingface.co/onnx-community/BiRefNet_lite-ONNX/resolve/main/preprocessor_config.json?download=true"
          curl.exe -L --retry 4 --retry-delay 3 -o "$root/onnx/model.onnx" "https://huggingface.co/onnx-community/BiRefNet_lite-ONNX/resolve/main/onnx/model.onnx?download=true"
          if ((Get-Item "$root/onnx/model.onnx").Length -lt 100MB) { throw 'BiRefNet model download incomplete' }

      - name: Syntax check TBRetoch
        shell: pwsh
        run: |
          node --check tuan-bo-ai-studio/studio/src/main.js
          node --check tuan-bo-ai-studio/studio/src/preload.js
          node --check tuan-bo-ai-studio/studio/src/aiService.js
          node --check tuan-bo-ai-studio/studio/src/exportService.js
          node --check tuan-bo-ai-studio/studio/src/licenseService.js
          node --check tuan-bo-ai-studio/studio/src/renderer/renderer.js

      - name: Install TBRetoch dependencies
        working-directory: tuan-bo-ai-studio/studio
        run: npm install

      - name: Generate TB logo PNG
        working-directory: tuan-bo-ai-studio/studio
        shell: pwsh
        run: node -e "require('sharp')('resources/tb-icon.svg').resize(256,256).png().toFile('resources/tb-icon.png').then(()=>console.log('TB icon OK'))"

      - name: Real offline AI CPU smoke test
        working-directory: tuan-bo-ai-studio/studio
        run: node scripts/smoke-ai.mjs

      - name: Build TBRetoch installer
        working-directory: tuan-bo-ai-studio/studio
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Create 20 MB download parts and merge tool
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $installer = Get-ChildItem 'tuan-bo-ai-studio/studio/dist/*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'TBRetoch installer not found' }
          $chunkSize = 20 * 1024 * 1024
          $input = [System.IO.File]::OpenRead($installer.FullName)
          $index = 1
          try {
            $buffer = New-Object byte[] $chunkSize
            while (($read = $input.Read($buffer,0,$buffer.Length)) -gt 0) {
              $part = Join-Path 'release' ("TBRetoch-V0.4.part{0:D2}" -f $index)
              $out = [System.IO.File]::Create($part)
              try { $out.Write($buffer,0,$read) } finally { $out.Dispose() }
              $index++
            }
          } finally { $input.Dispose() }
          $count = $index - 1
          $parts = 1..$count | ForEach-Object { '"' + ("TBRetoch-V0.4.part{0:D2}" -f $_) + '"' }
          $copyLine = 'copy /b ' + ($parts -join '+') + ' "TBRetoch-V0.4-Setup.exe"'
          @(
            '@echo off','chcp 65001 >nul','title TBRetoch - Ghep bo cai','echo ==============================================','echo              TBRETOCH V0.4','echo ==============================================','echo.','echo Dang ghep cac part...',$copyLine,'if errorlevel 1 goto error','echo.','echo Ghep thanh cong: TBRetoch-V0.4-Setup.exe','certutil -hashfile "TBRetoch-V0.4-Setup.exe" SHA256','pause','exit /b 0',':error','echo LOI: Thieu part hoac part bi hong.','pause','exit /b 1'
          ) | Set-Content 'release/Ghep_TBRetoch-V0.4.bat' -Encoding ASCII
          $hash=(Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          @(
            'TBRETOCH V0.4 - TEAM OFFLINE BUILD','',"Parts: $count","SHA256: $hash",'',
            '1. Tai du tat ca TBRetoch-V0.4.partXX','2. Tai Ghep_TBRetoch-V0.4.bat','3. Dat cung mot thu muc','4. Chay file BAT','5. Chay TBRetoch-V0.4-Setup.exe','',
            'Ban nay khong can license. Export khong gioi han. AI uu tien DirectML GPU tren Windows va fallback CPU.'
          ) | Set-Content 'release/HUONG_DAN_TBRETOCH_V0.4.txt' -Encoding UTF8

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TBRetoch-V0.4-Windows
          path: tuan-bo-ai-studio/studio/dist/*.exe

      - name: Publish public GitHub Release download parts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'tbretouch-v0.4-download'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'TBRetoch V0.4 - Team Offline CPU GPU' --notes 'TBRetoch V0.4: logo TB, giao diện tím, pan/zoom kéo ảnh, preview nhẹ hơn, DirectML GPU AI + CPU fallback, export full resolution chất lượng cao, không giới hạn export/không cần license. Chia part 20 MB.'
          }
          gh release upload $tag 'release/*' --repo $env:GITHUB_REPOSITORY --clobber
